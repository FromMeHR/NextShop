services:
  db:
    image: postgres:16
    container_name: db
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - shop_net

  back:
    build:
      context: .
      dockerfile: Dockerfile.back
    container_name: back
    restart: always
    command: gunicorn --workers 2 --log-level debug shop.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static:/shop/app/public/static
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - shop_net

  front:
    build:
      context: .
      dockerfile: Dockerfile.front-prod
      secrets:
        - front_build_env
    env_file:
      - ./frontend/.env.production
    container_name: front-prod
    restart: always
    networks:
      - shop_net

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    volumes:
      - ./etc/nginx-prod.conf:/etc/nginx/nginx.conf
      - static:/shop/app/public/static
    depends_on:
      - back
      - front
    ports:
      - "80:80"
    networks:
      - shop_net

  redis:
    image: redis:8
    container_name: redis
    command: [
      "redis-server",
      "--maxmemory", "1000mb",
      "--maxmemory-policy", "allkeys-lru",
      "--appendonly", "yes"
    ]
    restart: always
    volumes:
      - redis_data_prod:/data
    networks:
      - shop_net

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.back
    container_name: celery_worker
    restart: always
    command: ["celery", "-A", "shop", "worker", "-l", "INFO"]
    volumes:
      - static:/shop/app/public/static
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - shop_net

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.back
    container_name: celery_beat
    restart: always
    command: ["celery", "-A", "shop", "beat", "-l", "INFO"]
    volumes:
      - static:/shop/app/public/static
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - shop_net

networks:
  shop_net:
    name: shop_net
secrets:
  front_build_env:
    file: ./frontend/.env.production
volumes:
  db_data:
  static:
  redis_data_prod: