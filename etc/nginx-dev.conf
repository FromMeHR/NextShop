worker_processes auto;
worker_rlimit_nofile 10000;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    server_tokens off;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_disable msie6;
    gzip_comp_level 5;
    gzip_proxied any;

    keepalive_timeout 60;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;
        client_max_body_size 10M;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_pass http://front:3000/;
            proxy_redirect off;
        }

        location /api/ {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_pass http://back:8000/api/;
            proxy_redirect off;
        }

        location /_next/webpack-hmr {
            proxy_pass http://front:3000/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /media/ {
            alias /shop/app/public/media/; 
            access_log off;
            expires 7d;
            add_header Cache-Control 'public, no-transform';
        }

        location /static/admin/ {
            alias /shop/app/public/static/admin/;
        }

        location /static/debug_toolbar/ {
            alias /shop/app/public/static/debug_toolbar/;
        }

        location /static/rest_framework/ {
            alias /shop/app/public/static/rest_framework/;
        }

        location /static/mptt/ {
            alias /shop/app/public/static/mptt/;
        }

        location /pgadmin/ {
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_pass http://pgadmin/;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}